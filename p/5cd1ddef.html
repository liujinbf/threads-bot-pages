<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>台股早盤精選分析</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #38bdf822;
      color: #38bdf8;
      border: 1px solid #38bdf844;
      border-radius: 99px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background: #0ea5e9;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .3px;
      transition: opacity .2s;
    }

    .btn:hover {
      opacity: .85;
    }

    .note {
      margin-top: 20px;
      font-size: 11px;
      color: #475569;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="badge">📈 私密邀請</div>
    <h1>台股早盤精選分析</h1>
    <p>每日盤前精選個股，助您掌握先機</p>
    <a class="btn" href="https://t.me/your_tw_channel" target="_blank" rel="noopener">立即加入分析群</a>
    <div class="note">限時開放 · 1780919077</div>
  </div>
</body>

</html>
