<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threads Bot Landing Host</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:680px;padding:32px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(15,23,42,.72);box-shadow:0 24px 80px rgba(0,0,0,.3)}
    h1{margin:0 0 12px;font-size:28px}p{line-height:1.7;color:#94a3b8}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:rgba(56,189,248,.12);color:#38bdf8;font-size:13px}
  </style>
</head>
<body>
  <main>
    <span class="pill">GitHub Pages Ready</span>
    <h1>Threads Bot Landing Host</h1>
    <p>此仓库用于托管云端自动生成的中转落地页。系统会自动发布到 <code>/p/*.html</code> 路径。</p>
  </main>
</body>
</html>
